name: PromptPad CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-backend:
    name: Validate backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Lint backend
        working-directory: backend
        run: ruff check app tests

      - name: Test backend
        working-directory: backend
        run: python -m pytest

  validate-frontend:
    name: Validate frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-and-push:
    name: Build and publish container images
    needs:
      - validate-backend
      - validate-frontend
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Normalize image owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/promptpad-backend:sha-${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.value }}/promptpad-backend:latest
          cache-from: type=gha,scope=promptpad-backend
          cache-to: type=gha,scope=promptpad-backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/promptpad-frontend:sha-${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.value }}/promptpad-frontend:latest
          cache-from: type=gha,scope=promptpad-frontend
          cache-to: type=gha,scope=promptpad-frontend,mode=max

  deploy-ec2:
    name: Deploy to EC2 through Systems Manager
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: promptpad-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy containers to EC2 with Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: sha-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$EC2_INSTANCE_ID" || -z "$AWS_REGION" ]]; then
            echo "EC2_INSTANCE_ID and AWS_REGION repository variables must be configured."
            exit 1
          fi

          IMAGE_OWNER="${IMAGE_OWNER,,}"
          IMAGE_PREFIX="ghcr.io/${IMAGE_OWNER}/promptpad"
          COMPOSE_B64="$(base64 -w 0 compose.prod.yaml)"

          COMMANDS="$(jq -cn \
            --arg compose_b64 "$COMPOSE_B64" \
            --arg image_prefix "$IMAGE_PREFIX" \
            --arg image_tag "$IMAGE_TAG" \
            '[
              "set -eu",
              "mkdir -p /opt/promptpad",
              ("printf %s " + ($compose_b64 | @sh) + " | base64 -d > /opt/promptpad/compose.prod.yaml"),
              ("cd /opt/promptpad && export IMAGE_PREFIX=" + ($image_prefix | @sh) + " IMAGE_TAG=" + ($image_tag | @sh) + " && docker compose -f compose.prod.yaml pull && docker compose -f compose.prod.yaml up -d --remove-orphans --wait --wait-timeout 120 && curl --fail --silent --show-error http://127.0.0.1/api/health")
            ]')"

          PARAMETERS="$(jq -cn --argjson commands "$COMMANDS" '{commands: $commands}')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy PromptPad ${GITHUB_SHA}" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "$STATUS" in
              Success)
                echo "Deployment succeeded."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deployment failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          echo "Timed out waiting for the EC2 deployment command."
          exit 1
